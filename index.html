<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finanças da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --floresta:#0F3D2E; --floresta-2:#174C3A; --floresta-3:#245C48; --menta:#CFE6D9; --menta-2:#9CC9B1;
  --papel:#F6F7F5; --branco:#FFFFFF; --tinta:#17201C; --tinta-2:#3A4540; --nevoa:#66716C; --linha:#DFE4E0; --linha-2:#EDF0EE;
  --pos:#1E8A57; --pos-bg:#E5F3EB; --neg:#C23B2B; --neg-bg:#F9E7E4; --alerta:#B7800E; --alerta-bg:#FBF1DC; --info:#2E66B0; --info-bg:#E6EEF8;
  --c1:#4A6FC2; --c2:#0F7A55; --c3:#C07A12;
  --r-painel:14px; --r-campo:8px;
  --sombra:0 1px 0 rgba(15,61,46,.04), 0 8px 24px -16px rgba(15,61,46,.25);
  --fonte:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fonte);background:var(--papel);color:var(--tinta);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.oculto{display:none!important}

/* ---------- Login ---------- */
#telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--floresta)}
.login{width:100%;max-width:380px;color:#fff}
.login h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.login p{color:var(--menta-2);margin-bottom:28px}
.login label{display:block;font-size:13px;color:var(--menta);margin:14px 0 6px}
.login input{width:100%;padding:13px 14px;border-radius:var(--r-campo);border:1px solid var(--floresta-3);background:var(--floresta-2);color:#fff;font-size:16px}
.login input::placeholder{color:#7FA595}
.login .btn{width:100%;margin-top:22px;background:var(--menta);color:var(--floresta);font-weight:700;padding:13px}
.login-erro{display:none;margin-top:12px;background:#5A1F17;color:#FFD9D2;padding:10px 12px;border-radius:var(--r-campo);font-size:14px}

/* ---------- Estrutura ---------- */
#app{display:none}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.menu{background:var(--floresta);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.marca{padding:4px 10px 22px}
.marca strong{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.marca span{font-size:12.5px;color:var(--menta-2)}
.menu button.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#D5E6DD;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14.5px;font-weight:500}
.menu button.nav svg{width:18px;height:18px;flex:none;opacity:.75}
.menu button.nav:hover{background:var(--floresta-2);color:#fff}
.menu button.nav[aria-current="page"]{background:var(--menta);color:var(--floresta);font-weight:700}
.menu button.nav[aria-current="page"] svg{opacity:1}
.menu .rodape-menu{margin-top:auto;padding:16px 10px 0;font-size:12.5px;color:var(--menta-2);border-top:1px solid var(--floresta-3)}
.menu .rodape-menu button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;margin-top:4px}
.conteudo{padding:28px 34px 80px;max-width:1240px;width:100%}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topo h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.topo p{color:var(--nevoa);font-size:14px;margin-top:2px}
.barra-mobile,.abas-mobile{display:none}

/* ---------- Componentes ---------- */
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-painel);padding:20px 22px;box-shadow:var(--sombra)}
.painel+.painel,.grade+.painel,.painel+.grade,.grade+.grade{margin-top:18px}
.grade>.painel,.grade>div>.painel:first-child{margin-top:0}
.painel h2{font-size:16.5px;font-weight:700;letter-spacing:-.005em}
.painel .sub{color:var(--nevoa);font-size:13.5px;margin-top:2px}
.cab-painel{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grade{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-7-5{grid-template-columns:7fr 5fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-campo);padding:10px 16px;font-weight:600;font-size:14.5px;cursor:pointer;background:var(--floresta);color:#fff;white-space:nowrap}
.btn:hover{background:var(--floresta-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--branco);color:var(--floresta);border:1px solid var(--linha)}
.btn.sec:hover{background:var(--linha-2)}
.btn.perigo{background:var(--neg)}
.btn.pequeno{padding:6px 11px;font-size:13px}
.btn.link{background:none;color:var(--info);padding:0;font-weight:600}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label{font-size:13px;font-weight:600;color:var(--tinta-2)}
.campo .dica{font-size:12.5px;color:var(--nevoa)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:var(--r-campo);background:var(--branco);font-size:15px;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--floresta-3);outline:2px solid var(--menta);outline-offset:0}
.linha-campos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.segmentado{display:inline-flex;background:var(--linha-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.segmentado button{border:0;background:none;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--tinta-2);cursor:pointer}
.segmentado button[aria-pressed="true"]{background:var(--branco);color:var(--floresta);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav-periodo{display:inline-flex;align-items:center;gap:6px}
.nav-periodo button{width:34px;height:34px;border-radius:8px;border:1px solid var(--linha);background:var(--branco);cursor:pointer;font-size:16px;color:var(--floresta)}
.nav-periodo strong{min-width:150px;text-align:center;font-size:14.5px}
.valor{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .alerta{color:var(--alerta)} .info{color:var(--info)} .mudo{color:var(--nevoa)}
.etiqueta{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--linha-2);color:var(--tinta-2);white-space:nowrap}
.etiqueta.pos{background:var(--pos-bg);color:var(--pos)} .etiqueta.neg{background:var(--neg-bg);color:var(--neg)}
.etiqueta.alerta{background:var(--alerta-bg);color:#8A5F06} .etiqueta.info{background:var(--info-bg);color:var(--info)}
.vazio{padding:22px;text-align:center;color:var(--nevoa);font-size:14px}
.nota{font-size:12.5px;color:var(--nevoa);margin-top:10px}

/* ---------- Hero (Visão Geral) ---------- */
.hero{background:var(--floresta);color:#fff;border-radius:18px;padding:26px 28px 18px;display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:28px;position:relative;overflow:hidden}
.hero .rotulo{color:var(--menta-2);font-size:14px}
.hero .pl{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:6px 0 8px}
.hero .delta{font-size:14px;color:var(--menta)}
.hero .mini{margin-top:22px;display:grid;gap:9px;font-size:14px}
.hero .mini div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--floresta-3);padding-bottom:7px}
.hero .mini span{color:var(--menta-2)}
.hero h2{font-size:15px;font-weight:600;color:#fff}
.hero .legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--menta-2);margin-top:4px}
.hero .legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fluxo svg{width:100%;height:auto;display:block;overflow:visible}

/* balanço em linha */
.balanco{display:grid;grid-template-columns:repeat(4,1fr);background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-painel);margin-top:18px;box-shadow:var(--sombra)}
.balanco>div{padding:16px 20px;border-left:1px solid var(--linha)}
.balanco>div:first-child{border-left:0}
.balanco span{display:block;font-size:13px;color:var(--nevoa)}
.balanco strong{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.balanco small{font-size:12.5px;color:var(--nevoa)}

/* razão do mês */
.razao{display:grid}
.razao .l{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--linha)}
.razao .l:last-child{border-bottom:0}
.razao .l span{color:var(--tinta-2);font-size:14px}
.razao .l.total{border-top:2px solid var(--tinta);border-bottom:0;margin-top:4px;padding-top:11px}
.razao .l.total span{color:var(--tinta);font-weight:700}

/* diagnóstico */
.diag{display:grid;gap:10px}
.diag-item{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:11px 12px;border-radius:10px;background:var(--linha-2);font-size:14px;line-height:1.45}
.diag-item svg{width:20px;height:20px;margin-top:1px}
.diag-item.pos{background:var(--pos-bg);color:var(--tinta)} .diag-item.pos svg{color:var(--pos)}
.diag-item.neg{background:var(--neg-bg);color:var(--tinta)} .diag-item.neg svg{color:var(--neg)}
.diag-item.alerta{background:var(--alerta-bg);color:var(--tinta)} .diag-item.alerta svg{color:var(--alerta)}
.diag-item.info{background:var(--info-bg);color:var(--tinta)} .diag-item.info svg{color:var(--info)}
.diag-item small{display:block;color:var(--nevoa);font-size:12.5px;margin-top:3px}

/* barras horizontais */
.barras{display:grid;gap:11px}
.barra .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.barra .t b{font-weight:600}
.trilho{height:8px;background:var(--linha-2);border-radius:4px;overflow:hidden;position:relative}
.trilho i{display:block;height:100%;border-radius:4px;background:var(--floresta-3)}
.trilho i.pos{background:var(--pos)} .trilho i.alerta{background:var(--alerta)} .trilho i.neg{background:var(--neg)} .trilho i.info{background:var(--info)}
.trilho .marca-orc{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta)}

/* tabelas */
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{text-align:left;font-weight:600;color:var(--nevoa);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tabela td{padding:10px;border-bottom:1px solid var(--linha-2);vertical-align:top}
.tabela td.n,.tabela th.n{text-align:right;white-space:nowrap}
.tabela tr.arquivo td{color:var(--nevoa)}
.tabela tr.novo td{background:#E5F3EB}
.tabela tr.novo td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
.clicavel{cursor:pointer;border-radius:8px}
.barra.clicavel:hover .t b,.tabela tr.clicavel:hover td{color:var(--floresta);text-decoration:underline;text-underline-offset:3px}
.tabela tr.clicavel:hover td{background:var(--linha-2)}
.gap-pos{color:var(--pos);font-weight:700}.gap-neg{color:var(--neg);font-weight:700}
.tabela tfoot td{font-weight:700;border-top:2px solid var(--tinta)}
.sub-lista{font-size:13.5px;font-weight:700;color:var(--tinta-2);margin:18px 0 4px;display:flex;justify-content:space-between}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lanc-desc{font-weight:600}
.lanc-meta{font-size:12.5px;color:var(--nevoa);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acoes{display:flex;gap:4px;justify-content:flex-end}
.icone-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--nevoa);display:inline-flex;align-items:center;justify-content:center}
.icone-btn:hover{background:var(--linha-2);color:var(--tinta)}
.icone-btn svg{width:16px;height:16px}

/* lançamento rápido */
.rapido{display:grid;grid-template-columns:150px 1.1fr 1.4fr 140px auto;gap:10px;align-items:end}
.mais-opcoes{margin-top:14px;padding-top:14px;border-top:1px solid var(--linha-2)}

/* vazamentos */
.vaz{display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--linha-2)}
.vaz:last-child{border-bottom:0}
.vaz .pos-rank{font-size:22px;font-weight:800;color:var(--menta-2);line-height:1}
.vaz h3{font-size:15.5px;font-weight:700}
.vaz .motivo{font-size:13.5px;color:var(--tinta-2);margin-top:3px}
.vaz .reco{font-size:13.5px;margin-top:6px}
.vaz .nums{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;text-align:right;font-size:13px;align-content:start}
.vaz .nums span{color:var(--nevoa)}
.vaz .nums b{font-size:14.5px}
.vaz.revisado{opacity:.55}

/* modal */
.modal{position:fixed;inset:0;background:rgba(12,30,23,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.aberto{display:flex}
.modal .caixa{background:var(--branco);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h2{font-size:19px;font-weight:800;margin-bottom:6px}
.modal .botoes{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}
#tip{position:fixed;pointer-events:none;background:var(--tinta);color:#fff;font-size:12.5px;padding:8px 10px;border-radius:8px;z-index:70;opacity:0;transition:opacity .1s;line-height:1.45;max-width:240px}
#tip.on{opacity:1}
#tip b{font-weight:700}
.carregando{padding:60px;text-align:center;color:var(--nevoa)}

.grafico svg{width:100%;height:auto;display:block;overflow:visible}
.legenda-g{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--tinta-2);margin-bottom:8px}
.legenda-g i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}

/* ---------- Responsivo ---------- */
@media (max-width:1080px){
  .g-7-5,.g2{grid-template-columns:1fr}
  .rapido{grid-template-columns:1fr 1fr}
  .rapido .campo-desc{grid-column:1/-1}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .menu{display:none}
  .barra-mobile{display:flex;align-items:center;justify-content:space-between;background:var(--floresta);color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:20}
  .barra-mobile strong{font-size:17px;font-weight:800}
  .barra-mobile button{background:var(--floresta-2);border:0;color:#fff;border-radius:8px;padding:7px 12px;font-weight:600}
  .abas-mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--branco);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom);z-index:20}
  .abas-mobile button{background:none;border:0;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--nevoa);display:flex;flex-direction:column;align-items:center;gap:3px}
  .abas-mobile button svg{width:21px;height:21px}
  .abas-mobile button[aria-current="page"]{color:var(--floresta)}
  .conteudo{padding:20px 16px 96px}
  .topo h1{font-size:23px}
  .hero{grid-template-columns:1fr;padding:22px 18px 14px;gap:18px}
  .hero .pl{font-size:36px}
  .balanco{grid-template-columns:1fr 1fr}
  .balanco>div:nth-child(3){border-left:0}
  .balanco>div:nth-child(n+3){border-top:1px solid var(--linha)}
  .g3{grid-template-columns:1fr}
  .painel{padding:16px}
  .vaz{grid-template-columns:30px 1fr}
  .vaz .nums{grid-column:2;text-align:left;grid-template-columns:repeat(3,1fr)}
  .tabela .esconde-m{display:none}
}
.folha-mais{position:fixed;inset:auto 0 0 0;background:var(--branco);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -10px 30px rgba(0,0,0,.15);display:none}
.folha-mais.aberta{display:block}
.folha-mais button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:13px 8px;font-size:15.5px;font-weight:600;border-bottom:1px solid var(--linha-2);text-align:left}
.folha-mais svg{width:20px;height:20px;color:var(--floresta)}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="telaLogin" style="display:none">
  <form class="login" onsubmit="return false">
    <h1>Finanças da Família</h1>
    <p>Seu orientador financeiro. Entre para continuar.</p>
    <label for="loginEmail">E-mail</label>
    <input type="email" id="loginEmail" autocomplete="email" inputmode="email" placeholder="seu@email.com">
    <label for="loginSenha">Senha</label>
    <input type="password" id="loginSenha" autocomplete="current-password" placeholder="Sua senha">
    <button class="btn" id="btnEntrar" type="submit">Entrar</button>
    <div class="login-erro" id="loginErro" role="alert"></div>
  </form>
</section>

<!-- ================= APP ================= -->
<div id="app">
  <header class="barra-mobile"><strong>Finanças da Família</strong><button id="btnNovoMobile" type="button">Lançar</button></header>
  <div class="layout">
    <nav class="menu" id="menu" aria-label="Navegação principal">
      <div class="marca"><strong>Finanças da Família</strong><span id="marcoMenu">Marco Zero</span></div>
    </nav>
    <main class="conteudo" id="conteudo"><div class="carregando">Carregando seus dados…</div></main>
  </div>
  <nav class="abas-mobile" id="abasMobile" aria-label="Navegação"></nav>
  <div class="folha-mais" id="folhaMais"></div>
</div>

<!-- Modal genérico -->
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="caixa" id="modalCaixa"></div></div>
<div id="aviso" role="status" aria-live="polite"></div>
<div id="tip"></div>

<script>

const nomeYM = k => { const m=MESES[+k.slice(5,7)-1]; return m[0].toUpperCase()+m.slice(1)+' de '+k.slice(0,4); };
const curtoYM = k => MESES_C[+k.slice(5,7)-1]+(k.slice(5,7)==='01'?' '+k.slice(2,4):'');
function addYM(k,n){ const t=(+k.slice(0,4))*12+(+k.slice(5,7))-1+n; return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0'); }
function addMeses(isoS,n){ const [a,m,d]=isoS.split('-').map(Number); const dt=new Date(a,m-1+n,1); const ult=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(); dt.setDate(Math.min(d,ult)); return iso(dt); }
function diaNoMes(k,dia){ const [a,m]=k.split('-').map(Number); const ult=new Date(a,m,0).getDate(); return k+'-'+String(Math.min(dia,ult)).padStart(2,'0'); }
const diasNoMes = k => new Date(+k.slice(0,4), +k.slice(5,7), 0).getDate();
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});

const lancDe = r => ({ id:r.id, data:r.data, categoria:r.categoria, descricao:r.descricao||'', valor:Number(r.valor), forma:r.forma, quem:r.quem||'',
  criado_em:r.criado_em||'', cartao:r.cartao||null, fatura_venc:r.fatura_venc||null, origem:r.origem||'manual', chave_import:r.chave_import||null,
  essencial:r.essencial ?? null, observacao:r.observacao||'',
  parcela: r.parcela_total>1 ? {n:r.parcela_n,total:r.parcela_total,grupo:r.parcela_grupo} : null,
  recorrente: r.recorrente_total>1 ? {n:r.recorrente_n,total:r.recorrente_total,grupo:r.recorrente_grupo} : null });

async function carregar(){
  const q = t => sb.from(t).select('*');
  const [cats,lans,ents,pats,buds] = await Promise.all([sb.from('categorias').select('nome').order('nome'), q('lancamentos'), q('entradas'), q('patrimonio'), q('budgets')]);
  const err = cats.error||lans.error||ents.error||pats.error||buds.error;
  if(err){ document.getElementById('conteudo').innerHTML=`<div class="painel vazio">Não foi possível carregar os dados (${esc(err.message)}). Recarregue a página.</div>`; return; }
  S.cats = cats.data.map(c=>c.nome);
  S.lanc = lans.data.map(lancDe);
  S.ent  = ents.data.map(e=>({id:e.id,data:e.data,descricao:e.descricao,valor:Number(e.valor),quem:e.quem||'',recorrente:!!e.recorrente,categoria:e.categoria||null}));
  S.pat  = pats.data.map(p=>({...p, valor:Number(p.valor), natureza:p.natureza||'ativo'}));
  S.bud = {}; buds.data.forEach(b=>{ (S.bud[b.ano] ||= {})[b.categoria]=Number(b.valor_mensal); });
  // tabelas novas — o app funciona mesmo se a migração ainda não foi aplicada
  const [hist,cart,metas,cfg] = await Promise.all([q('patrimonio_historico'), q('cartoes'), q('metas'), q('config')]);
  S.novasTabelas = !(hist.error||cart.error||metas.error||cfg.error);
  S.hist = hist.data ? hist.data.map(h=>({...h,valor:Number(h.valor)})) : [];
  S.cartoes = cart.data && cart.data.length ? cart.data : [{id:null,nome:'Nubank',limite:null,dia_fechamento:30,dia_vencimento:7}];
  S.metas = metas.data || [];
  const pr = await q('plano_receitas'); S.planoRec = pr.error ? [] : pr.data.map(x=>({...x,valor:+x.valor}));
  S.cfg = {}; (cfg.data||[]).forEach(c=>S.cfg[c.chave]=c.valor);
  if(!S.cfg.marco_zero) S.cfg.marco_zero = {data:'2026-11-19'};
  S.cfg.premissas = {...DEFAULT_PREMISSAS, ...(S.cfg.premissas||{})};
  document.getElementById('marcoMenu').textContent = 'Marco Zero em '+dataBR(corte());
  ir(vistaAtual);
}

   REGRAS FINANCEIRAS

const corte = () => S.cfg.marco_zero?.data || '2026-11-19';
const pos = x => x.data >= corte();                       // registro da fase nova
const cartaoDe = nome => S.cartoes.find(c=>c.nome===nome) || S.cartoes[0];
function faturaVenc(l){                                   // data de vencimento da fatura em que o item cai
  if(l.forma!=='Crédito') return null;
  if(l.fatura_venc) return l.fatura_venc;
  const c = cartaoDe(l.cartao); const k = ym(l.data); const dia = +l.data.slice(8,10);
  return diaNoMes(addYM(k, dia > c.dia_fechamento ? 2 : 1), c.dia_vencimento);
}
const dataCaixa = l => l.forma==='Crédito' ? faturaVenc(l) : l.data;   // quando o dinheiro sai da conta
function essencial(l){
  if(l.essencial!==null && l.essencial!==undefined) return l.essencial;
  const mapa = S.cfg.cat_essencial || {};
  if(l.categoria in mapa) return mapa[l.categoria];
  return !NAO_ESSENCIAIS.includes(l.categoria);
}
const ehAssinatura = l => l.categoria==='Assinaturas' || /netflix|spotify|apple\.com|anthropic|claude|melimais|disney|prime video|youtube|google one|hbo|\bmax\b|deezer|globoplay|nucel|seguro vida/i.test(l.descricao);
const despesasEm = (k, f=()=>true) => S.lanc.filter(l=>ym(l.data)===k && pos(l) && f(l));
const receitasEm = k => S.ent.filter(e=>ym(e.data)===k && pos(e));

function totaisPatrimonio(){
  const at = S.pat.filter(p=>p.natureza==='ativo'), pa = S.pat.filter(p=>p.natureza==='passivo');
  const disp = soma(at.filter(p=>DISPONIVEL.includes(p.tipo)));
  const inv  = soma(at.filter(p=>INVEST.includes(p.tipo)));
  const bens = soma(at) - disp - inv;
  const passivos = soma(pa);
  const cartaoAberto = soma(S.lanc.filter(l=>l.forma==='Crédito' && faturaVenc(l) >= HOJE));
  const dividas = passivos + cartaoAberto;
  return { ativos:soma(at), disp, inv, bens, passivos, cartaoAberto, dividas, liquido: soma(at) - dividas };
}
const fixoNoMes = (cat,k) => S.lanc.find(l=>l.origem==='fixo_orcado' && l.categoria===cat && ym(l.data)===k);
const EXTRA = /13|décimo|ferias|férias|bônus|bonus|plr/i;
const planoItens = k => S.planoRec.filter(p=>p.ano===+k.slice(0,4) && p.mes===+k.slice(5,7));
const planoMes = k => soma(planoItens(k));
function rendaBase(){
  if(S.cfg.premissas.renda_mensal) return +S.cfg.premissas.renda_mensal;
  const k0 = ym(HOJE); const vals=[];
  for(let i=0;i<12;i++){ const k=addYM(k0,i); let t=soma(S.ent.filter(e=>ym(e.data)===k && !EXTRA.test(e.descricao))); if(!t) t=soma(planoItens(k).filter(p=>!EXTRA.test(p.descricao))); if(t>0) vals.push(t); }
  if(!vals.length) return 0;
  vals.sort((a,b)=>a-b); return vals[Math.floor(vals.length/2)];
}
function fixasBase(){
  if(S.cfg.premissas.despesas_fixas_mensal) return +S.cfg.premissas.despesas_fixas_mensal;
  const k = addYM(ym(HOJE),1);
  return soma(S.lanc.filter(l=>l.recorrente && ym(l.data)===k));
}
/* Fluxo de caixa mensal: o que está registrado + estimativa de gastos variáveis */
function fluxoMes(k){
  let entR = soma(S.ent.filter(e=>ym(e.data)===k)); let entEst = 0;
  if(entR===0 && k>ym(HOJE)) entEst = planoMes(k) || rendaBase();
  const saiR = soma(S.lanc.filter(l=>ym(dataCaixa(l))===k));
  const kHoje = ym(HOJE); let est = 0;
  const v = +S.cfg.premissas.gasto_variavel_mensal || 0;
  if(k > kHoje) est = v;
  else if(k === kHoje){ const d=+HOJE.slice(8,10), dm=diasNoMes(k); est = v * Math.max(0,dm-d)/dm; }
  return { k, entradas:entR, entEst, saidas:saiR, estimado:est, saldo: entR + entEst - saiR - est };
}

/* fluxo divergente: entradas para cima, saídas para baixo */
function svgFluxo(meses, escuro=true){
  const W=720,H=250,pl=8,pr=8,pt=18,pb=26, n=meses.length, bw=(W-pl-pr)/n;
  const maxE=Math.max(1,...meses.map(m=>m.entradas+(m.entEst||0))), maxS=Math.max(1,...meses.map(m=>m.saidas+m.estimado));
  const maxV=Math.max(maxE,maxS); const h=(H-pt-pb); const zero=pt+h*maxE/(maxE+maxS);
  const esc_=v=>v/(maxE+maxS)*h;
  const cE=escuro?'#9CC9B1':'#1E8A57', cS=escuro?'#F0A496':'#C23B2B', cTxt=escuro?'#9CC9B1':'#66716C', cZero=escuro?'#3D7560':'#DFE4E0';
  const kC = ym(corte()), kH=ym(HOJE);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fluxo de caixa dos próximos meses: entradas e saídas">`;
  g+=`<defs><pattern id="hach" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${escuro?'#0F3D2E':'#fff'}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${cS}" stroke-width="2"/></pattern><pattern id="hachE" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${escuro?'#0F3D2E':'#fff'}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${cE}" stroke-width="2"/></pattern></defs>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${zero}" y2="${zero}" stroke="${cZero}" stroke-width="1"/>`;
  meses.forEach((m,i)=>{
    const x=pl+i*bw, w=Math.max(6,bw*0.56), cx=x+(bw-w)/2;
    const he=esc_(m.entradas), hs=esc_(m.saidas), hz=esc_(m.estimado);
    const hee=esc_(m.entEst||0); if(hee>0) g+=`<path d="M${cx} ${zero-1} v${-(hee-4)} q0 -4 4 -4 h${w-8} q4 0 4 4 v${hee-4} z" fill="url(#hachE)" stroke="${cE}" stroke-width="1"/>`;
    if(he>0) g+=`<path d="M${cx} ${zero-1} v${-(he-4)} q0 -4 4 -4 h${w-8} q4 0 4 4 v${he-4} z" fill="${cE}"/>`;
    if(hs>0) g+=`<rect x="${cx}" y="${zero+1}" width="${w}" height="${Math.max(0,hs-1)}" fill="${cS}"/>`;
    if(hz>0) g+=`<path d="M${cx} ${zero+1+hs+ (hs>0?2:0)} h${w} v${hz-4} q0 4 -4 4 h${-(w-8)} q-4 0 -4 -4 z" fill="url(#hach)" stroke="${cS}" stroke-width="1"/>`;
    const lbl = curtoYM(m.k);
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="${m.k===kH?(escuro?'#fff':'#17201C'):cTxt}" font-weight="${m.k===kH?700:400}">${lbl}</text>`;
    if(m.k===kC){ g+=`<line x1="${x+2}" x2="${x+2}" y1="${pt-10}" y2="${H-pb+2}" stroke="${escuro?'#CFE6D9':'#0F3D2E'}" stroke-dasharray="3 3"/><text x="${x+6}" y="${pt-4}" font-size="11.5" fill="${escuro?'#CFE6D9':'#0F3D2E'}">Marco Zero</text>`; }
    const t=`<b>${nomeYM(m.k)}</b><br>Entradas: ${fmt(m.entradas)}${m.entEst?`<br>Receita ${planoMes(m.k)?'planejada':'estimada'}: ${fmt(m.entEst)}`:''}<br>Saídas registradas: ${fmt(m.saidas)}${m.estimado?`<br>Variáveis estimadas: ${fmt(m.estimado)}`:''}<br><b>Saldo: ${fmt(m.saldo)}</b>`;
    g+=`<rect x="${x}" y="0" width="${bw}" height="${H-pb}" fill="transparent" data-tip="${T(t)}"/>`;
  });
  return g+'</svg>';
}

/* linhas (patrimônio, projeção) */
function svgLinhas(labels, series, opts={}){
  const W=opts.w||720,H=opts.h||260,pl=62,pr=14,pt=14,pb=28;
  const todos=series.flatMap(s=>s.v.filter(v=>v!=null));
  let mn=Math.min(0,...todos), mx=Math.max(...todos,1); const pad=(mx-mn)*0.08; mx+=pad; if(mn<0) mn-=pad;
  const X=i=>pl+(labels.length<2?0:i*(W-pl-pr)/(labels.length-1)), Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Gráfico de linhas')}">`;
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#EDF0EE"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11.5" fill="#66716C">${fmtK(v)}</text>`; }
  const passo=Math.ceil(labels.length/8);
  labels.forEach((l,i)=>{ if(i%passo===0||i===labels.length-1) g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="#66716C">${esc(l)}</text>`; });
  series.forEach(s=>{
    const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.tracejado?'stroke-dasharray="5 4"':''}/>`;
    if(pts.length<=14) pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.cor}" stroke="#fff" stroke-width="2"/>`);
    const u=pts[pts.length-1]; if(opts.rotular) g+=`<text x="${u[0]-4}" y="${u[1]-9}" text-anchor="end" font-size="12" font-weight="600" fill="#17201C">${esc(s.nome)}</text>`;
  });
  const cw=(W-pl-pr)/Math.max(1,labels.length-1);
  labels.forEach((l,i)=>{ const t=`<b>${esc(l)}</b>`+series.map(s=>s.v[i]==null?'':`<br>${esc(s.nome)}: ${fmt0(s.v[i])}`).join(''); g+=`<rect x="${X(i)-cw/2}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent" data-tip="${T(t)}"/>`; });
  return g+'</svg>';
}
function barrasH(itens, opts={}){
  if(!itens.length) return `<div class="vazio">${opts.vazio||'Sem dados no período.'}</div>`;
  const mx=Math.max(...itens.map(i=>Math.max(i.v,i.orc||0)));
  return `<div class="barras">${itens.map(i=>`<div class="barra ${opts.drill?'clicavel':''}" ${opts.drill?`role="button" tabindex="0" data-drill="${T(JSON.stringify({...opts.drill,cat:i.nome}))}"`:''} data-tip="${T(`<b>${esc(i.nome)}</b><br>${fmt(i.v)}${i.orc?`<br>Orçamento: ${fmt(i.orc)} (${pct(i.v/i.orc)})`:''}${i.extra?'<br>'+i.extra:''}${opts.drill?'<br><i>Clique para ver os lançamentos</i>':''}`)}">

}

/* =====================================================================
   DIAGNÓSTICO / ORIENTADOR — frases a partir dos dados reais
   ===================================================================== */
function analises(completo=false){
  const out=[]; const add=(tipo,txt,base)=>out.push({tipo,txt,base});
  const k=ym(HOJE), kc=ym(corte());
  const rec=soma(receitasEm(k)), des=soma(despesasEm(k));
  const parcial = k===kc && corte().slice(8)!=='01';
  if(rec>0){
    const econ=(rec-des)/rec;
    add(econ>=0.2?'pos':econ>=0?'alerta':'neg',
      `Você recebeu ${fmt(rec)} em ${MESES[+k.slice(5)-1]} e tem ${fmt(des)} em despesas registradas${parcial?' desde o Marco Zero':''}. A capacidade de economia está em ${pct(econ)}.`,
      'Realizado + lançamentos já agendados no mês.');
  } else add('info',`Ainda não há receitas registradas em ${MESES[+k.slice(5)-1]} após o Marco Zero.`,'Registre salários e outras entradas para o orientador calcular a capacidade de economia.');
  const renda=rendaBase(); const tp=totaisPatrimonio();
  const parcFut=soma(S.lanc.filter(l=>l.parcela && dataCaixa(l)>HOJE));
  if(parcFut>0){
    const prox=soma(S.lanc.filter(l=>l.parcela && ym(dataCaixa(l))===addYM(k,1)));
    add(renda && prox/renda>0.15?'alerta':'info',`Você possui ${fmt(parcFut)} comprometidos em parcelas futuras de cartão — ${fmt(prox)} só no próximo mês${renda?` (${pct(prox/renda)} da renda)`:''}.`,'Soma das parcelas já lançadas, pela data de vencimento da fatura.');
  }
  const fix=fixasBase()+soma(S.lanc.filter(l=>l.parcela && ym(dataCaixa(l))===addYM(k,1)));
  if(renda>0){
    const c=fix/renda;
    add(c>0.5?'neg':c>0.35?'alerta':'pos',`O comprometimento da renda com despesas recorrentes e parcelas está em ${pct(c)} (${fmt(fix)} de ${fmt(renda)}/mês).${c>0.35?' Esse é hoje o seu principal ponto de atenção.':''}`,'Estimativa: recorrentes + parcelas do próximo mês sobre a renda mensal típica.');
  }
  // categorias que cresceram (últimos 30 dias vs. média dos 90 anteriores) — usa histórico só para comparação
  const d30=addMeses(HOJE,-1), d120=addMeses(HOJE,-4);
  const porCat=(ini,fim)=>{const o={}; S.lanc.filter(l=>l.data>ini&&l.data<=fim&&!l.parcela&&!l.recorrente).forEach(l=>o[l.categoria]=(o[l.categoria]||0)+l.valor); return o;};
  const rec30=porCat(d30,HOJE), ant=porCat(d120,d30);
  Object.entries(rec30).forEach(([c,v])=>{ const m=(ant[c]||0)/3; if(m>150 && v>m*1.18) add('alerta',`Seus gastos com ${c.toLowerCase()} nos últimos 30 dias (${fmt(v)}) estão ${pct(v/m-1)} acima da média mensal dos três meses anteriores.`,'Compara compras à vista; parcelas e recorrências ficam de fora.'); });
  // economia potencial em 5 anos
  const naoEss = soma(S.lanc.filter(l=>l.data>addMeses(HOJE,-3)&&l.data<=HOJE&&!essencial(l)&&!l.parcela))/3;
  if(naoEss>200){
    const red=Math.round(naoEss*0.25/50)*50||50; const r=(+S.cfg.premissas.rentab_aa||0)/100/12; let acc=0; for(let i=0;i<60;i++) acc=acc*(1+r)+red;
    add('info',`Se reduzir as despesas não essenciais em ${fmt0(red)} por mês, você pode acumular cerca de ${fmt0(acc)} em cinco anos, considerando ${String(S.cfg.premissas.rentab_aa).replace('.',',')}% ao ano.`,'Simulação. Não é garantia de rentabilidade.');
  }
  // patrimônio desde o marco zero
  const h0 = S.hist.filter(h=>h.data===corte()); const pl0 = soma(h0.filter(h=>h.natureza!=='passivo')) - soma(h0.filter(h=>h.natureza==='passivo'));
  if(h0.length && pl0>0){ const plAtual = tp.ativos - tp.passivos; const v=plAtual/pl0-1; add(v>=0?'pos':'neg',`Seu patrimônio (bens e aplicações, sem cartão) ${v>=0?'evoluiu':'recuou'} ${pct(Math.abs(v),1)} desde o Marco Zero.`,'Com base nos valores informados em Patrimônio.'); }
  const desat = S.pat.filter(p=>p.atualizado_em && (Date.now()-new Date(p.atualizado_em))/864e5>60);
  if(desat.length) add('alerta',`${desat.length} ${desat.length>1?'itens do patrimônio estão':'item do patrimônio está'} sem atualização há mais de 60 dias (${desat.map(p=>p.nome).slice(0,3).join(', ')}). Atualize para o Marco Zero refletir a realidade.`,'Patrimônio > editar valor.');
  if(tp.disp>0 && fix>0){ const meses=tp.disp/(fix+(+S.cfg.premissas.gasto_variavel_mensal||0)); add(meses>=6?'pos':meses>=3?'alerta':'neg',`O dinheiro disponível cobre cerca de ${meses.toLocaleString('pt-BR',{maximumFractionDigits:1})} meses do seu custo de vida.`,'Reserva = contas e reserva de emergência; custo = fixas + variáveis estimadas.'); }
  const ordem={neg:0,alerta:1,info:2,pos:3};
  out.sort((a,b)=>ordem[a.tipo]-ordem[b.tipo]);
  return completo? out : out.slice(0,5);
}

async function salvarLanc(){
  const data=document.getElementById('fData').value, desc=document.getElementById('fDesc').value.trim(), valor=parseFloat(String(document.getElementById('fValor').value).replace(',','.'));
  const rep=+document.getElementById('fRec').value, obs=document.getElementById('fObs').value.trim();
  if(!data||!(valor>0)){ avisar('Informe a data e um valor maior que zero.'); return; }
  if(UI.tipoLanc==='receita'){
    if(!desc){ avisar('Informe a descrição da receita.'); return; }
    const quem=document.getElementById('fQuemR').value.trim();
    const linhas=Array.from({length:rep},(_,i)=>({id:uid(),data:addMeses(data,i),descricao:desc,valor,quem}));
    const {error}=await sb.from('entradas').insert(linhas); if(error) return erroBanco(error);
    S.ent.push(...linhas.map(e=>({...e,recorrente:rep>1}))); NOVOS.add(linhas[0].id); UI.mesLanc=ym(linhas[0].data); avisar(rep>1?`Receita lançada por ${rep} meses`:'Receita lançada'); ir('lanc'); return;
  }
  const cat=document.getElementById('fCat').value, quem=document.getElementById('fQuem').value.trim(), essV=document.getElementById('fEss').value;
  const parc= UI.forma==='Crédito' ? +document.getElementById('fParc').value : 1, cartao= UI.forma==='Crédito' ? document.getElementById('fCartao').value : null;
  if(parc>1 && rep>1){ avisar('Use parcelas ou repetição, não os dois juntos.'); return; }
  const base={categoria:cat,descricao:desc,forma:UI.forma,quem,observacao:obs||null,cartao,origem:'manual',essencial: essV===''?null:essV==='1'};
  const linhas=[]; const agora=new Date().toISOString();
  if(rep>1){ const g=uid(); for(let i=0;i<rep;i++) linhas.push({...base,id:uid(),data:addMeses(data,i),valor,recorrente_n:i+1,recorrente_total:rep,recorrente_grupo:g,criado_em:agora}); }
  else { const g=parc>1?uid():null; const vp=Math.round(valor/parc*100)/100; for(let i=0;i<parc;i++){ const v= i===parc-1 ? Math.round((valor-vp*(parc-1))*100)/100 : vp;
    const l={...base,id:uid(),data:addMeses(data,i),valor:v,parcela_n:parc>1?i+1:null,parcela_total:parc>1?parc:null,parcela_grupo:g,criado_em:agora};
    if(UI.forma==='Crédito'){ const c=cartaoDe(cartao); const k0=ym(data), dia=+data.slice(8,10); l.fatura_venc=diaNoMes(addYM(k0,(dia>c.dia_fechamento?2:1)+i),c.dia_vencimento); }
    linhas.push(l);} }
  const dDesc=chaveCat(desc), dia=linhas[0].data;
  const dup=S.lanc.find(l=>l.data===dia && Math.abs(l.valor-linhas[0].valor)<0.005)
         || (dDesc.length>=3 && S.lanc.find(l=>Math.abs((new Date(l.data)-new Date(dia))/864e5)<=1 && chaveCat(l.descricao)===dDesc && Math.abs(l.valor-linhas[0].valor)<=Math.max(5,linhas[0].valor*0.15)));
  const gravar=async()=>{
    const ins = S.novasTabelas? linhas : linhas.map(({cartao,fatura_venc,origem,essencial,observacao,...r})=>r);
    const btn=document.getElementById('btnSalvarLanc'); if(btn) btn.disabled=true;
    const {error}=await sb.from('lancamentos').insert(ins); if(btn) btn.disabled=false;
    if(error) return erroBanco(error);
    S.lanc.push(...ins.map(lancDe)); NOVOS.add(ins[0].id); UI.mesLanc=ym(ins[0].data); UI.buscaLanc=''; fecharModal(); avisar(rep>1?`Despesa lançada por ${rep} meses`:parc>1?`Lançada em ${parc}x de ${fmt(linhas[0].valor)}`:'Despesa lançada'); ir('lanc');
  };
  const fixo = !dup && rep===1 && parc===1 && fixoNoMes(cat, ym(dia));
  if(fixo){ abrirModal(`<h2>${esc(cat)} já tem conta fixa neste mês</h2><p>Já está lançada a conta fixa de ${fmt(fixo.valor)} em ${esc(cat)} para ${nomeYM(ym(dia))}. Se este gasto faz parte dela, não precisa lançar. Se for um gasto a mais, pode lançar.</p>
    <div class="botoes"><button class="btn sec" onclick="fecharModal()">Não lançar</button><button class="btn" id="mConf">Lançar como gasto a mais</button></div>`); document.getElementById('mConf').onclick=gravar; return; }
  if(dup){ abrirModal(`<h2>Pode ser um lançamento repetido</h2><p>Já existe <b>${esc(dup.descricao||dup.categoria)}</b> de ${fmt(dup.valor)} em ${esc(dup.categoria)} no dia ${dataBR(dup.data)}. Você está lançando ${fmt(linhas[0].valor)} em ${esc(cat)} no dia ${dataBR(dia)}. Deseja lançar mesmo assim?</p>
    <div class="botoes"><button class="btn sec" onclick="fecharModal()">Não lançar</button><button class="btn" id="mConf">Lançar mesmo assim</button></div>`); document.getElementById('mConf').onclick=gravar; return; }
  gravar();
}
function abrirModal(html){ const c=document.getElementById('modalCaixa'); c.innerHTML=html; c.scrollTop=0; document.getElementById('modal').classList.add('aberto'); setTimeout(()=>{ const i=c.querySelector('input,select'); if(i) i.focus({preventScroll:true}); else { c.setAttribute('tabindex','-1'); c.focus({preventScroll:true}); } c.scrollTop=0; },30); }

document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') fecharModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fecharModal(); });

  document.getElementById('eSalvar').onclick=async()=>{
    const ev=document.getElementById('eEss').value; const ess= ev===''?null:ev==='1';

    if(serie){ const col=l.parcela?'parcela_grupo':'recorrente_grupo'; const r2=await sb.from('lancamentos').update(comum).eq(col,g); if(r2.error) return erroBanco(r2.error);
      S.lanc.filter(x=>(x.parcela?.grupo||x.recorrente?.grupo)===g).forEach(x=>Object.assign(x,comum)); }
    Object.assign(l,comum,{valor:v,data:d}); fecharModal(); avisar(serie?'Série atualizada':'Lançamento atualizado'); ir(vistaAtual);
  };

function pedirExclusao(id){
  const l=S.lanc.find(x=>x.id===id); if(!l) return; const g=l.parcela?.grupo||l.recorrente?.grupo;
  const futuros = g ? S.lanc.filter(x=>(x.parcela?.grupo||x.recorrente?.grupo)===g && x.data>=l.data).length : 0;
  abrirModal(`<h2>Excluir lançamento?</h2><p>${esc(l.descricao||l.categoria)} · ${fmt(l.valor)} em ${dataBR(l.data)}. Essa ação não pode ser desfeita.</p>
  <div class="botoes"><button class="btn sec" onclick="fecharModal()">Cancelar</button>${g?`<button class="btn sec" id="xSerie" style="color:var(--neg)">Excluir este e os ${futuros-1} seguintes</button>`:''}<button class="btn perigo" id="xUm">Excluir só este</button></div>`);
  document.getElementById('xUm').onclick=async()=>{ const {error}=await sb.from('lancamentos').delete().eq('id',id); if(error) return erroBanco(error,'excluir'); S.lanc=S.lanc.filter(x=>x.id!==id); fecharModal(); avisar('Lançamento excluído'); ir(vistaAtual); };
  if(g) document.getElementById('xSerie').onclick=async()=>{ const col=l.parcela?'parcela_grupo':'recorrente_grupo'; const {error}=await sb.from('lancamentos').delete().eq(col,g).gte('data',l.data); if(error) return erroBanco(error,'excluir');
    S.lanc=S.lanc.filter(x=>!((x.parcela?.grupo||x.recorrente?.grupo)===g && x.data>=l.data)); fecharModal(); avisar('Lançamentos excluídos'); ir(vistaAtual); };
}

function editarReceita(id){
  const e=S.ent.find(x=>x.id===id); if(!e) return;
  const seguintes=S.ent.filter(x=>x.id!==id && x.descricao===e.descricao && x.data>e.data);
  abrirModal(`<h2>Editar receita</h2><div class="linha-campos" style="margin-top:12px">
   <div class="campo" style="grid-column:1/-1"><label for="rDesc">Descrição</label><input type="text" id="rDesc" value="${esc(e.descricao)}"></div>
   <div class="campo"><label for="rVal">Valor (R$)</label><input type="number" step="0.01" id="rVal" value="${e.valor}"></div>
   <div class="campo"><label for="rData">Data</label><input type="date" id="rData" value="${e.data}"></div>
   <div class="campo"><label for="rQuem">De quem</label><input type="text" id="rQuem" value="${esc(e.quem||'')}"></div></div>
   ${seguintes.length?`<label style="display:flex;gap:8px;margin-top:14px;font-size:14px"><input type="checkbox" id="rSeg"> Aplicar descrição e valor também às ${seguintes.length} receitas seguintes "${esc(e.descricao)}"</label>`:''}
   <div class="botoes"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="rOk">Salvar receita</button></div>`);
  document.getElementById('rOk').onclick=async()=>{
    const desc=document.getElementById('rDesc').value.trim(), valor=parseFloat(document.getElementById('rVal').value), data=document.getElementById('rData').value, quem=document.getElementById('rQuem').value.trim();
    if(!desc||!(valor>0)||!data) return avisar('Descrição, valor e data são obrigatórios.');
    let r=await sb.from('entradas').update({descricao:desc,valor,data,quem}).eq('id',id); if(r.error) return erroBanco(r.error);
    const aplicar=document.getElementById('rSeg')?.checked;
    if(aplicar){ const ids=seguintes.map(x=>x.id); r=await sb.from('entradas').update({descricao:desc,valor}).in('id',ids); if(r.error) return erroBanco(r.error); seguintes.forEach(x=>Object.assign(x,{descricao:desc,valor})); }
    Object.assign(e,{descricao:desc,valor,data,quem}); fecharModal(); avisar(aplicar?`Receita atualizada (e mais ${seguintes.length})`:'Receita atualizada'); ir(vistaAtual);
  };
}
async function excluirEnt(id){

}

 [/Posto|Combust/i,'Gasolina',true],[/Droga|Farm/i,'Farmácia',true],[/Clube|Massa Bruta/i,'Clube',false],[/Electrol|Glass|Casadedec|Rinaldi|Leroy|Telhanorte/i,'Apartamento / Casa',true],
 [/Centauro|Bob Esportes|Renner|Shein|C&A|Riachuelo/i,'Roupas',false],[/Mercadolivre|Mercado\*|Shopee|Aliexpress|Amazon|Fid Comercio|Lojanoca|Magalu/i,'Compras online',false]];

function parseCSV(txt){
  const linhas=[]; let campo='', linha=[], aspas=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(aspas){ if(ch==='"'){ if(txt[i+1]==='"'){ campo+='"'; i++; } else aspas=false; } else campo+=ch; }
    else if(ch==='"') aspas=true; else if(ch===','){ linha.push(campo); campo=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; linha.push(campo); campo=''; if(linha.some(x=>x.trim())) linhas.push(linha); linha=[]; }
    else campo+=ch; }
  if(campo||linha.length){ linha.push(campo); if(linha.some(x=>x.trim())) linhas.push(linha); }
  const cab=(linhas.shift()||[]).map(h=>h.trim().toLowerCase().replace(/^\ufeff/,''));
  const iD=cab.indexOf('date'), iT=cab.indexOf('title'), iA=cab.indexOf('amount');
  if(iD<0||iT<0||iA<0) return [];
  const num=v=>{ v=String(v).replace(/\s/g,''); if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); return parseFloat(v); };
  return linhas.map(l=>({date:(l[iD]||'').trim(), title:(l[iT]||'').trim(), amount:num(l[iA])})).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.date));
}
function previaImport(txt){
  const venc=document.getElementById('iVenc').value; const box=document.getElementById('iPrev');
  if(!venc){ box.innerHTML='<div class="diag-item alerta">'+ico('alerta')+'<div>Informe o vencimento da fatura.</div></div>'; return; }
  const rows=parseCSV(txt); const novos=[], existentes=[], ignorados=[], cobertos=[];
  const kV=ym(venc); const c=cartaoDe('Nubank');
  const visto={};
  rows.forEach(r=>{
    if(!(r.amount>0) || /^IOF|^Pagamento|^Estorno/i.test(r.title)){ ignorados.push(r); return; }
    let chave=`nubank:${r.date}:${r.title}:${r.amount.toFixed(2)}`; visto[chave]=(visto[chave]||0)+1; if(visto[chave]>1) chave+='#'+visto[chave];
    const pm=r.title.match(/^(.*?) - Parcela (\d+)\/(\d+)$/); const base=pm?pm[1]:r.title;
    const ja=S.lanc.find(l=>l.chave_import===chave) || S.lanc.find(l=>l.forma==='Crédito' && Math.abs(l.valor-r.amount)<0.005 && (pm ? (l.parcela && l.parcela.n==+pm[2] && l.parcela.total==+pm[3] && ym(faturaVenc(l))===kV) : (l.data===r.date)));
    if(ja){ existentes.push({r,l:ja,chave}); return; }
    const {c:cat,e}=catAuto(base);
    if(pm){ const n=+pm[2], tot=+pm[3], g=uid(); for(let j=n;j<=tot;j++){ const kv=addYM(kV,j-n); const kc=addYM(kv,-1);
      novos.push({id:uid(),data: j===n && !pm ? r.date : diaNoMes(kc,30),categoria:cat,descricao:base,valor:r.amount,forma:'Crédito',quem:'TP',cartao:'Nubank',fatura_venc:diaNoMes(kv,c.dia_vencimento),origem:'import_nubank',chave_import: j===n?chave:`nubank:${base}:${j}/${tot}:${r.amount.toFixed(2)}`,essencial:e,parcela_n:j,parcela_total:tot,parcela_grupo:g,_fut:j>n}); } }
    else { const item={id:uid(),data:r.date,categoria:cat,descricao:r.title,valor:r.amount,forma:'Crédito',quem:'TP',cartao:'Nubank',fatura_venc:venc,origem:'import_nubank',chave_import:chave,essencial:e};
      const fx=fixoNoMes(cat,ym(r.date)); if(fx) cobertos.push({...item,_fixo:fx.valor}); else novos.push(item); }
  });
  const atual=novos.filter(n=>!n._fut), fut=novos.filter(n=>n._fut);
  const totCSV=soma(rows.filter(r=>r.amount>0&&!/^Pagamento|^IOF/i.test(r.title)),r=>r.amount);
  box.innerHTML=`<div class="razao"><div class="l"><span>Total da fatura no arquivo</span><b>${fmt(totCSV)}</b></div><div class="l"><span>Já lançados no sistema (${existentes.length})</span><b>${fmt(soma(existentes,x=>x.r.amount))}</b></div>
   <div class="l"><span>Novos nesta fatura (${atual.length})</span><b>${fmt(soma(atual))}</b></div><div class="l"><span>Parcelas futuras a gerar (${fut.length})</span><b>${fmt(soma(fut))}</b></div><div class="l"><span>Ignorados (pagamento, IOF)</span><b>${ignorados.length}</b></div>
   ${cobertos.length?`<div class="l"><span>Cobertos por conta fixa do mês (${cobertos.length}): ${cobertos.map(c=>esc(c.descricao)).join(', ')}</span><b>${fmt(soma(cobertos))}</b></div>`:''}</div>
   ${cobertos.length?`<label style="display:flex;gap:8px;margin-top:8px;font-size:13.5px"><input type="checkbox" id="iCob"> Importar também os itens cobertos por conta fixa (eles serão contados além da conta fixa)</label>`:''}
   ${atual.length?`<div class="rolagem" style="max-height:220px;margin-top:10px"><table class="tabela"><tbody>${atual.map(n=>`<tr><td>${dataBR(n.data)}</td><td>${esc(n.descricao)}${n.parcela_n?` <span class="etiqueta info">${n.parcela_n}/${n.parcela_total}</span>`:''}<div class="lanc-meta">${esc(n.categoria)}</div></td><td class="n">${fmt(n.valor)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  const btn=document.getElementById('iOk'); btn.disabled=!novos.length && !cobertos.length;
  btn.onclick=async()=>{ const incl=document.getElementById('iCob')?.checked; const lista=[...novos, ...(incl?cobertos:[])]; if(!lista.length){ fecharModal(); avisar('Nada novo para importar'); return; }
    btn.disabled=true; const ins=lista.map(({_fut,_fixo,...x})=>x);
    if(!S.novasTabelas){ avisar('Aplique a atualização do banco antes de importar.'); return; }
    const {error}=await sb.from('lancamentos').insert(ins); if(error){ btn.disabled=false; return erroBanco(error,'importar'); }
    for(const x of existentes){ if(!x.l.chave_import){ await sb.from('lancamentos').update({chave_import:x.chave,cartao:'Nubank',fatura_venc:venc}).eq('id',x.l.id); Object.assign(x.l,{chave_import:x.chave,cartao:'Nubank',fatura_venc:venc}); } }
    S.lanc.push(...ins.map(lancDe)); NOVOS.add(ins[0].id); UI.mesLanc=ym(ins[0].data); UI.buscaLanc=''; fecharModal(); avisar(`${atual.length} itens importados e ${fut.length} parcelas futuras geradas`); ir('cartoes'); };
}
function exportarCSV(){
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  let csv='﻿Tipo;Data;Categoria;Descricao;Forma;Cartao;Vencimento fatura;Parcela;Recorrente;Essencial;Quem;Valor\n';
  S.lanc.forEach(l=>csv+=['DESPESA',l.data,q(l.categoria),q(l.descricao),l.forma,q(l.cartao),faturaVenc(l)||'',l.parcela?`${l.parcela.n}/${l.parcela.total}`:'',l.recorrente?`${l.recorrente.n}/${l.recorrente.total}`:'',essencial(l)?'sim':'não',q(l.quem),String(l.valor).replace('.',',')].join(';')+'\n');
  S.ent.forEach(e=>csv+=['RECEITA',e.data,'',q(e.descricao),'','','','','','',q(e.quem),String(e.valor).replace('.',',')].join(';')+'\n');
  baixar(csv,'financas-familia-'+HOJE+'.csv','text/csv;charset=utf-8'); avisar('CSV exportado');
}

  const cats=[...new Set([...Object.keys(orc),...Object.keys(real)])].sort((a,b)=>(real[b]||0)/(orc[b]||1)-(real[a]||0)/(orc[a]||1));

function projetar(ajuste){
  const P=S.cfg.premissas, tp=totaisPatrimonio(), H=UI.horizonte;
  const renda0=rendaBase(), fix0=fixasBase(), var0=+P.gasto_variavel_mensal||0;
  const g=((+P.cresc_renda_aa||0)+ajuste.g)/100, inf=((+P.inflacao_aa||0)+ajuste.i)/100, r=((+P.rentab_aa||0)+ajuste.r)/100;
  const rm=Math.pow(1+r,1/12)-1; let caixa=tp.disp+tp.inv - tp.cartaoAberto; const out=[], k0=ym(HOJE);
  const passivoAmort = S.pat.filter(p=>p.natureza==='passivo'); let passivos=tp.passivos;
  const anosPlano=S.planoRec.map(p=>p.ano), ultPlano=anosPlano.length?Math.max(...anosPlano):0;
  const anosOrc=Object.keys(S.bud).map(Number).filter(a=>Object.keys(S.bud[a]).length), ultOrc=anosOrc.length?Math.max(...anosOrc):0;
  const recAnoFinal = ultPlano? soma(S.planoRec.filter(p=>p.ano===ultPlano))/12 : renda0;
  const despAnoFinal = ultOrc? soma(Object.values(S.bud[ultOrc]),x=>x) : fix0+var0;
  for(let t=1;t<=H;t++){
    const k=addYM(k0,t), ano=+k.slice(0,4), anosAdj=(t-1)/12;
    const real=soma(S.ent.filter(e=>ym(e.data)===k)), pl=planoMes(k);
    let renda, desp;
    if(real||pl) renda=(real||pl)*Math.pow(1+ajuste.g/100,anosAdj);
    else if(ultPlano) renda=recAnoFinal*Math.pow(1+g,Math.max(0,ano-ultPlano));
    else renda=renda0*Math.pow(1+g,Math.floor((t-1)/12));
    const parcelas=soma(S.lanc.filter(l=>l.parcela && ym(dataCaixa(l))===k));
    if(S.bud[ano] && Object.keys(S.bud[ano]).length) desp=gapMes(k).previsto*Math.pow(1+ajuste.i/100,anosAdj);
    else if(ultOrc) desp=despAnoFinal*Math.pow(1+inf,Math.max(0,ano-ultOrc))+parcelas;
    else desp=(fix0+var0)*Math.pow(1+inf,(t-1)/12)+parcelas;
    const amort=soma(passivoAmort.filter(p=>p.valor_parcela && (p.parcelas_restantes==null||t<=p.parcelas_restantes)),p=>+p.valor_parcela);
    caixa = caixa*(1+rm) + renda - desp; passivos=Math.max(0,passivos-amort);
    out.push({k, renda, desp, saldo:renda-desp, caixa, pl: caixa + tp.bens - passivos});
  }
  return out;
}

function gapMes(k){
  const kc=ym(corte()), ano=k.slice(0,4);
  const fator = k===kc ? (diasNoMes(k)-(+corte().slice(8))+1)/diasNoMes(k) : 1;
  let ents=S.ent.filter(e=>ym(e.data)===k && pos(e)); let rec=soma(ents), recEst=false, recPlano=false;
  if(rec===0 && k>ym(HOJE)){ const pl=planoItens(k); if(pl.length){ ents=pl.map(p=>({descricao:p.descricao,valor:p.valor,data:null})); rec=soma(pl); recPlano=true; } else { rec=rendaBase(); recEst=true; } }
  const caixa=S.lanc.filter(l=>ym(dataCaixa(l))===k && (k!==kc || dataCaixa(l)>=corte()));
  const comprometido=soma(caixa);
  const comp=S.lanc.filter(l=>ym(l.data)===k && pos(l)); const porCat={}; comp.forEach(l=>porCat[l.categoria]=(porCat[l.categoria]||0)+l.valor);
  const orc=S.bud[ano]; let previsto, base;
  const linhasCat=[];
  if(orc && Object.keys(orc).length){
    base='orcamento';
    const cats=new Set([...Object.keys(orc),...Object.keys(porCat)]);
    previsto=0; cats.forEach(c=>{ const o=(orc[c]||0)*fator, r=porCat[c]||0; const v=Math.max(o,r); previsto+=v; linhasCat.push({c,o,r,v}); });
  } else { base='premissa'; previsto=soma(comp)+(k>=ym(HOJE)?(+S.cfg.premissas.gasto_variavel_mensal||0)*fator:0); Object.entries(porCat).forEach(([c,r])=>linhasCat.push({c,o:0,r,v:r})); }
  linhasCat.sort((a,b)=>b.v-a.v);
  return {k,rec,recEst,recPlano,ents,comprometido,caixa,previsto,base,linhasCat,gapComp:rec-comprometido,gapPrev:rec-previsto,fator};
}

function editarPlanoReceitas(anoSel){

   <label style="display:flex;gap:8px;margin-top:12px;font-size:14px"><input type="checkbox" id="pSeg"> Aplicar a mesma tabela aos anos seguintes até 2030</label>
   <div class="botoes"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="pOk">Salvar ${ano}</button></div>`);

    const alvo=[ano]; if(document.getElementById('pSeg').checked) for(let a=ano+1;a<=2030;a++) alvo.push(a);
    for(const a of alvo){ let r=await sb.from('plano_receitas').delete().eq('ano',a); if(r.error) return erroBanco(r.error);
      if(linhas.length){ r=await sb.from('plano_receitas').insert(linhas.map(x=>({...x,ano:a}))); if(r.error) return erroBanco(r.error); } }
    S.planoRec=S.planoRec.filter(p=>!alvo.includes(p.ano)).concat(alvo.flatMap(a=>linhas.map(x=>({...x,ano:a}))));
    fecharModal(); avisar('Receitas planejadas salvas'); ir('plan');
  };
}

function detectarVazamentos(){
  const janela = UI.janelaVaz==='mz' ? corte() : addMeses(HOJE,-3);
  const dias = Math.max(1,(new Date(HOJE)-new Date(janela))/864e5); const meses=dias/30.4;
  const base = S.lanc.filter(l=>l.data>janela && l.data<=HOJE);
  const renda=rendaBase(); const out=[];
  const add=(o)=>out.push({...o, anual:o.mensal*12});
  // 1. assinaturas
  const ass={}; base.filter(ehAssinatura).forEach(l=>{ const n=(l.descricao||l.categoria).replace(/[*\d.]+$/,'').trim(); (ass[n] ||= []).push(l); });
  const assM = Object.entries(ass).map(([n,ls])=>({n,v:ls.sort((a,b)=>b.data.localeCompare(a.data))[0].valor}));
  if(assM.length) add({id:'assinaturas',tipo:'Assinaturas e cobranças recorrentes',cat:'Assinaturas',mensal:soma(assM,x=>x.v),economia:soma(assM,x=>x.v)*0.3,
    motivo:`${assM.length} cobranças que se repetem: ${assM.sort((a,b)=>b.v-a.v).map(a=>`${a.n} (${fmt(a.v)})`).join(', ')}.`,reco:'Revise uma a uma: cancele o que não usou no último mês e troque planos mensais por anuais quando houver desconto.'});
  // 2. pequenos gastos
  const peq=base.filter(l=>l.valor<50 && !l.parcela && !l.recorrente && !ehAssinatura(l));
  if(peq.length>=8) add({id:'pequenos',tipo:'Gastos pequenos que somam muito',cat:'Vários',mensal:soma(peq)/meses,economia:soma(peq)/meses*0.4,
    motivo:`${peq.length} compras abaixo de R$ 50 no período, média de ${fmt(soma(peq)/peq.length)} cada.`,reco:'Defina uma mesada semanal para lanches, pedágios e cafés e acompanhe pelo app.'});
  // 3. não essenciais por categoria
  const ne={}; base.filter(l=>!essencial(l)&&!l.parcela&&!ehAssinatura(l)).forEach(l=>ne[l.categoria]=(ne[l.categoria]||0)+l.valor);
  Object.entries(ne).filter(([,v])=>v/meses>250).forEach(([c,v])=>add({id:'ne:'+c,tipo:`${c} — despesa não essencial`,cat:c,mensal:v/meses,economia:v/meses*0.25,
    motivo:`Categoria marcada como não essencial, com média de ${fmt(v/meses)} por mês no período.`,reco:`Uma redução de 25% libera ${fmt0(v/meses*.25)} por mês. Combine um teto mensal e registre no orçamento.`}));
  // 4. parcelamentos
  const parcFut=S.lanc.filter(l=>l.parcela && dataCaixa(l)>HOJE); const prox=soma(parcFut.filter(l=>ym(dataCaixa(l))===addYM(ym(HOJE),1)));
  const grupos=new Set(parcFut.map(l=>l.parcela.grupo)).size;
  if(prox>0) add({id:'parcelas',tipo:'Compras parceladas',cat:'Cartão',mensal:prox,economia:0,
    motivo:`${grupos} compras ainda em parcelas, ${fmt(soma(parcFut))} a pagar. Só no próximo mês: ${fmt(prox)}${renda?` (${pct(prox/renda)} da renda)`:''}.`,reco:'Evite novos parcelamentos até a soma mensal cair abaixo de 10% da renda; ela já reduz sozinha nos próximos meses.'});
  // 5. fora do padrão (> média + 2 desvios na categoria, histórico de comparação)
  const hist={}; S.lanc.filter(l=>!l.parcela&&!l.recorrente).forEach(l=>(hist[l.categoria] ||= []).push(l.valor));
  base.filter(l=>!l.parcela&&!l.recorrente).forEach(l=>{ const a=hist[l.categoria]; if(!a||a.length<6) return; const m=a.reduce((s,x)=>s+x,0)/a.length, sd=Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length);
    if(l.valor>m+2*sd && l.valor>150) add({id:'fora:'+l.id,tipo:`Gasto fora do padrão em ${l.categoria}`,cat:l.categoria,mensal:l.valor/12,economia:0,motivo:`${l.descricao||l.categoria} de ${fmt(l.valor)} em ${dataBR(l.data)}; o normal nessa categoria é ${fmt(m)}.`,reco:'Confirme se foi pontual. Se for recorrente, ajuste o orçamento da categoria.'}); });
  // 6. categorias acima do orçamento repetidamente
  const ano=HOJE.slice(0,4), orc=S.bud[ano]||{};
  Object.entries(orc).forEach(([c,o])=>{ let n=0; for(let i=0;i<3;i++){ const k=addYM(ym(HOJE),-i); const r=soma(S.lanc.filter(l=>ym(l.data)===k&&l.categoria===c)); if(r>o) n++; }
    if(n>=2) add({id:'orc:'+c,tipo:`${c} acima do orçamento`,cat:c,mensal:Math.max(0,soma(base.filter(l=>l.categoria===c))/meses-o),economia:Math.max(0,soma(base.filter(l=>l.categoria===c))/meses-o),motivo:`Passou do orçamento de ${fmt(o)} em ${n} dos últimos 3 meses.`,reco:'Ou o orçamento está irreal, ou o gasto precisa de um teto. Decida qual dos dois ajustar.'}); });
  // 7. despesas crescendo mais que a renda
  const ant=S.lanc.filter(l=>l.data>addMeses(janela,-3)&&l.data<=janela), rAnt=soma(S.ent.filter(e=>e.data>addMeses(janela,-3)&&e.data<=janela)), rAt=soma(S.ent.filter(e=>e.data>janela&&e.data<=HOJE));
  if(ant.length && rAnt>0 && rAt>0){ const gd=(soma(base)/meses)/(soma(ant)/3)-1, gr=(rAt/meses)/(rAnt/3)-1; if(gd>gr+0.1) add({id:'cresc',tipo:'Despesas crescendo mais que a renda',cat:'Geral',mensal:soma(base)/meses-soma(ant)/3,economia:(soma(base)/meses-soma(ant)/3)/2,motivo:`Despesas ${pct(gd)} vs. renda ${pct(gr)} em relação ao período anterior.`,reco:'Reveja primeiro as categorias não essenciais deste ranking.'}); }
  out.sort((a,b)=>b.anual-a.anual);
  return {lista:out, janela, meses};
}

    return `<div class="barra" style="padding:12px 0;border-bottom:1px solid var(--linha-2)"><div class="t"><b>${esc(m.nome)}</b><span>${fmt0(m.valor_atual)} de ${fmt0(m.valor_alvo)} · ${pct(p)}</span></div>
    <div class="trilho"><i class="${p>=1?'pos':'info'}" style="width:${Math.min(100,p*100)}%"></i></div>
    <div class="lanc-meta" style="margin-top:6px">${m.prazo?`Prazo ${dataBR(m.prazo)} · guardar ${fmt0(falta/meses)} por mês`:'Sem prazo definido'}<button class="btn link" style="font-size:12.5px" onclick="editarMeta('${m.id}')">atualizar</button></div></div>`; };
  return topo('Investimentos e metas','Aplicações e objetivos com prazo e valor mensal necessário.',`<div style="display:flex;gap:8px"><button class="btn" onclick="editarBem(null,'ativo')">Nova aplicação</button><button class="btn sec" onclick="editarMeta()">Nova meta</button></div>`)+`
  <div class="grade g-7-5">
    <section class="painel"><h2>Aplicações</h2><div class="sub">Cadastradas em Patrimônio com tipo Investimento, Reserva ou Poupança</div>
      ${inv.length?`<div class="rolagem"><table class="tabela" style="margin-top:8px"><thead><tr><th>Aplicação</th><th class="esconde-m">Liquidez</th><th class="n">Rent. a.a.</th><th class="n">Saldo</th></tr></thead><tbody>${inv.map(p=>`<tr><td><b>${esc(p.nome)}</b><div class="lanc-meta">${esc(p.tipo)}${p.instituicao?' · '+esc(p.instituicao):''}${p.vencimento?' · vence '+dataBR(p.vencimento):''}${p.aporte_mensal?' · aporte '+fmt0(p.aporte_mensal):''}</div></td><td class="esconde-m">${esc(p.liquidez||'—')}</td><td class="n">${p.rentab_aa!=null?String(p.rentab_aa).replace('.',',')+'%':'—'}</td><td class="n valor">${fmt0(p.valor)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="vazio">Nenhuma aplicação cadastrada.</div>'}
      <p class="nota">Reserva ideal (6 meses de custo de vida): ${fmt0(custo*6)}. Hoje disponível: ${fmt0(tp.disp)}.</p></section>
    <section class="painel"><div class="cab-painel"><h2>Metas</h2></div>
      ${S.metas.length? S.metas.map(metaHTML).join('') : `<div class="vazio">Nenhuma meta ainda.</div>`}
      ${!temReserva?`<button class="btn sec pequeno" style="margin-top:12px" onclick="editarMeta(null,{nome:'Reserva de emergência',tipo:'Reserva de emergência',valor_alvo:${Math.round(custo*6)},valor_atual:${Math.round(tp.disp)}})">Criar meta de reserva (${fmt0(custo*6)})</button>`:''}
    </section>
  </div>`;
}
function editarMeta(id,pre={}){
  const m=S.metas.find(x=>x.id===id)||{nome:'',tipo:'',valor_alvo:'',valor_atual:0,prazo:'',...pre};
  abrirModal(`<h2>${id?'Atualizar meta':'Nova meta'}</h2><div class="linha-campos" style="margin-top:12px">
   <div class="campo"><label for="mNome">Nome</label><input type="text" id="mNome" value="${esc(m.nome)}" placeholder="Ex.: Viagem em família"></div>
   <div class="campo"><label for="mTipo">Tipo</label><select id="mTipo">${['Reserva de emergência','Aquisição de imóvel','Viagem','Educação','Aposentadoria','Independência financeira','Outra'].map(t=>`<option ${t===m.tipo?'selected':''}>${t}</option>`).join('')}</select></div>
   <div class="campo"><label for="mAlvo">Valor alvo</label><input type="number" id="mAlvo" value="${m.valor_alvo}"></div><div class="campo"><label for="mAtual">Já guardado</label><input type="number" id="mAtual" value="${m.valor_atual}"></div>
   <div class="campo"><label for="mPrazo">Prazo</label><input type="date" id="mPrazo" value="${m.prazo||''}"></div></div>
   <div class="botoes">${id?`<button class="btn sec" style="color:var(--neg);margin-right:auto" id="mDel">Excluir</button>`:''}<button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="mOk">Salvar meta</button></div>`);
  document.getElementById('mOk').onclick=async()=>{ const r={nome:document.getElementById('mNome').value.trim(),tipo:document.getElementById('mTipo').value,valor_alvo:parseFloat(document.getElementById('mAlvo').value),valor_atual:parseFloat(document.getElementById('mAtual').value)||0,prazo:document.getElementById('mPrazo').value||null};
    if(!r.nome||!(r.valor_alvo>0)) return avisar('Informe nome e valor alvo.');
    const {data,error}= id? await sb.from('metas').update(r).eq('id',id).select() : await sb.from('metas').insert(r).select(); if(error) return erroBanco(error);
    S.metas=S.metas.filter(x=>x.id!==id).concat(data.map(d=>({...d,valor_alvo:+d.valor_alvo,valor_atual:+d.valor_atual}))); fecharModal(); avisar('Meta salva'); ir('inv'); };
  if(id) document.getElementById('mDel').onclick=async()=>{ const {error}=await sb.from('metas').delete().eq('id',id); if(error) return erroBanco(error,'excluir'); S.metas=S.metas.filter(x=>x.id!==id); fecharModal(); ir('inv'); };
}

/* =====================================================================
   ORIENTADOR
   ===================================================================== */
function vOrient(){
  const a=analises(true); const {lista}=detectarVazamentos(); const top=lista.slice(0,3);
  const tp=totaisPatrimonio(); const renda=rendaBase(); const fix=fixasBase(); const v=+S.cfg.premissas.gasto_variavel_mensal||0;
  const sobra=renda-fix-v-soma(S.lanc.filter(l=>l.parcela&&ym(dataCaixa(l))===addYM(ym(HOJE),1)));
  const real=projetar({g:0,i:0,r:0});
  return topo('Meu orientador financeiro','Leitura dos seus dados com premissas à vista. Estimativas aparecem marcadas como tal.')+`
  <section class="painel"><h2>As respostas que importam</h2><div class="razao" style="margin-top:10px">
    <div class="l"><span>Quanto posso investir por mês</span><b class="valor ${sobra>0?'pos':'neg'}">${fmt0(Math.max(0,sobra))} <span class="etiqueta info">estimado</span></b></div>
    <div class="l"><span>Quanto devo manter disponível</span><b class="valor">${fmt0((fix+v)*6)} <span class="mudo" style="font-weight:400">(6 meses de custo)</span></b></div>
    <div class="l"><span>Quanto estou comprometendo no futuro</span><b class="valor neg">${fmt0(soma(S.lanc.filter(l=>dataCaixa(l)>HOJE)))}</b></div>
    <div class="l"><span>Onde mais estou perdendo dinheiro</span><b class="valor">${top[0]?esc(top[0].tipo)+' · '+fmt0(top[0].anual)+'/ano':'—'}</b></div>
    ${[60,120].map(m=>real[m-1]?`<div class="l"><span>Onde estarei em ${m/12} anos (cenário realista)</span><b class="valor">${fmt0(real[m-1].pl)} <span class="etiqueta info">projeção</span></b></div>`:'').join('')}
    <div class="l"><span>Onde estarei em 15 anos (cenário realista)</span><b class="valor">${fmt0((()=>{const s=UI.horizonte;UI.horizonte=180;const d=projetar({g:0,i:0,r:0});UI.horizonte=s;return d[179].pl;})())} <span class="etiqueta info">projeção</span></b></div>
  </div><p class="nota">Base: renda típica ${fmt0(renda)}/mês, despesas fixas ${fmt0(fix)}, variáveis ${fmt0(v)} e as premissas do Planejamento.</p></section>
  <section class="painel"><h2>Análises</h2><div style="margin-top:12px">${diagHTML(a)}</div></section>
  <section class="painel"><h2>Decisões sugeridas</h2><div class="diag" style="margin-top:12px">
    ${top.map(t=>`<div class="diag-item info">${ico('infoI')}<div><b>${esc(t.tipo)}:</b> ${esc(t.reco)}</div></div>`).join('')}
    ${tp.disp < (fix+v)*6 ? `<div class="diag-item alerta">${ico('alerta')}<div>Complete a reserva de emergência antes de assumir novos parcelamentos: faltam ${fmt0((fix+v)*6-tp.disp)}.</div></div>` : `<div class="diag-item pos">${ico('ok')}<div>A reserva cobre 6 meses de custo. O excedente de ${fmt0(tp.disp-(fix+v)*6)} pode ir para aplicações de prazo maior.</div></div>`}
  </div></section>`;
}

/* =====================================================================
   RELATÓRIOS ANUAIS
   ===================================================================== */
function vRel(){
  const anos=[...new Set([...S.lanc,...S.ent].map(x=>x.data.slice(0,4)))].filter(a=>a<=HOJE.slice(0,4)).sort();
  UI.anoRel ||= HOJE.slice(0,4); const a=UI.anoRel;
  const res=ano=>{ const l=S.lanc.filter(x=>x.data.slice(0,4)===ano && x.data<=HOJE), e=S.ent.filter(x=>x.data.slice(0,4)===ano && x.data<=HOJE);
    const meses=new Set([...l,...e].map(x=>ym(x.data))).size; const cats={}; l.forEach(x=>cats[x.categoria]=(cats[x.categoria]||0)+x.valor);
    const h=S.hist.filter(x=>x.data.slice(0,4)===ano).sort((p,q)=>p.data.localeCompare(q.data));
    return {rec:soma(e),des:soma(l),meses,cats,ini:h[0]?.data,inv:soma(l.filter(x=>/invest|aporte/i.test(x.categoria+x.descricao)))}; };
  const r=res(a), ant=res(String(+a-1)); const comparavel = r.meses===12 && ant.meses===12;
  const top=Object.entries(r.cats).sort((x,y)=>y[1]-x[1]).slice(0,8);
  const cresceu=Object.entries(r.cats).map(([c,v])=>[c,v/Math.max(1,r.meses),(ant.cats[c]||0)/Math.max(1,ant.meses)]).filter(([,m,n])=>n>0&&m>n*1.15).sort((x,y)=>(y[1]-y[2])-(x[1]-x[2])).slice(0,4);
  const {lista}=detectarVazamentos();
  return topo('Relatórios anuais','Visão do ano e comparação com anos anteriores.',`<div class="segmentado" role="group" aria-label="Ano">${anos.map(x=>`<button type="button" aria-pressed="${x===a}" onclick="UI.anoRel='${x}';ir('rel')">${x}</button>`).join('')}</div>`)+`
  ${r.meses<12?`<div class="diag-item alerta" style="margin-bottom:16px">${ico('alerta')}<div>${a} tem ${r.meses} ${r.meses===1?'mês':'meses'} com registros. Os números abaixo não são de um ano completo e por isso não são comparados com anos anteriores como se fossem.</div></div>`:''}
  <div class="balanco" style="margin-top:0"><div><span>Receita</span><strong class="pos">${fmt0(r.rec)}</strong><small>média ${fmt0(r.rec/Math.max(1,r.meses))}/mês</small></div><div><span>Despesas</span><strong class="neg">${fmt0(r.des)}</strong><small>média ${fmt0(r.des/Math.max(1,r.meses))}/mês</small></div>
   <div><span>Economia</span><strong class="${r.rec-r.des>=0?'pos':'neg'}">${fmt0(r.rec-r.des)}</strong><small>${r.rec?pct((r.rec-r.des)/r.rec)+' da receita':''}</small></div><div><span>Meses com dados</span><strong>${r.meses}</strong><small>${comparavel?'comparável com '+(+a-1):'sem comparação anual'}</small></div></div>
  <div class="grade g2" style="margin-top:18px">
    <section class="painel"><h2>Principais categorias de gasto</h2><div style="margin-top:12px">${barrasH(top.map(([nome,v])=>({nome,v})),{total:r.des,drill:{ano:a}})}</div></section>
    <section class="painel"><h2>Resumo do ano</h2><div class="diag" style="margin-top:12px">
      <div class="diag-item ${r.rec-r.des>=0?'pos':'neg'}">${ico(r.rec-r.des>=0?'ok':'risco')}<div>Quanto foi economizado: ${fmt0(r.rec-r.des)} no período registrado.</div></div>
      ${cresceu.length?`<div class="diag-item alerta">${ico('alerta')}<div>Despesas que cresceram (média mensal vs. ${+a-1}): ${cresceu.map(([c,m,n])=>`${esc(c)} ${pct(m/n-1)}`).join(', ')}.</div></div>`:''}
      ${lista[0]?`<div class="diag-item info">${ico('infoI')}<div>Maior vazamento atual: ${esc(lista[0].tipo)} (${fmt0(lista[0].anual)}/ano).</div></div>`:''}
      <div class="diag-item info">${ico('infoI')}<div>Para o próximo ano: definir orçamento por categoria, completar a reserva de emergência e manter parcelas abaixo de 10% da renda.</div></div>
    </div><p class="nota">Patrimônio no início e no fim do ano aparece aqui conforme o histórico de avaliações for crescendo.</p></section>
  </div>`;
}

/* =====================================================================
   CONFIGURAÇÕES + MARCO ZERO
   ===================================================================== */
function vConf(){
  const tp=totaisPatrimonio(); const mapa=S.cfg.cat_essencial||{};
  const antes=S.lanc.filter(l=>l.data<corte()).length+S.ent.filter(e=>e.data<corte()).length;
  return topo('Configurações','Marco Zero, categorias e backup.')+`
  <section class="painel"><div class="cab-painel"><div><h2>Marco Zero financeiro</h2><div class="sub">A partir desta data começam os novos indicadores. Nada anterior foi apagado: ${antes} registros seguem disponíveis como arquivo.</div></div><button class="btn sec pequeno" onclick="alterarCorte()">Alterar data de corte</button></div>
    <div class="razao">
      <div class="l"><span>Data de corte</span><b>${dataBR(corte())}</b></div>
      <div class="l"><span>Dinheiro disponível (contas e reserva)</span><b>${fmt0(tp.disp)} <button class="btn link" onclick="ir('pat')">atualizar</button></b></div>
      <div class="l"><span>Investimentos</span><b>${fmt0(tp.inv)}</b></div>
      <div class="l"><span>Bens, imóveis e veículos</span><b>${fmt0(tp.bens)}</b></div>
      <div class="l"><span>Dívidas e financiamentos (saldo)</span><b>${fmt0(tp.passivos)}</b></div>
      <div class="l"><span>Faturas de cartão em aberto</span><b>${fmt0(tp.cartaoAberto)} <span class="mudo" style="font-weight:400">calculado</span></b></div>
      <div class="l"><span>Receitas mensais (típicas)</span><b>${fmt0(rendaBase())}</b></div>
      <div class="l"><span>Despesas fixas mensais</span><b>${fmt0(fixasBase())}</b></div>
      <div class="l"><span>Compromissos futuros registrados</span><b>${fmt0(soma(S.lanc.filter(l=>dataCaixa(l)>HOJE)))}</b></div>
    </div>
    <p class="nota">Os valores de abertura são saldos, não receitas nem despesas. Faturas e parcelas vêm dos lançamentos de cartão e por isso não devem ser cadastradas de novo como dívida.</p></section>
  <section class="painel"><h2>Categorias</h2><div class="sub">Marque quais são essenciais. Isso alimenta o identificador de vazamentos.</div>
    <div class="linha-campos" style="margin-top:12px">${S.cats.map(c=>{const e= c in mapa? mapa[c] : !NAO_ESSENCIAIS.includes(c); return `<label style="display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 0"><input type="checkbox" data-ess="${esc(c)}" ${e?'checked':''}> ${esc(c)}</label>`;}).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn pequeno" onclick="salvarEssenciais()">Salvar categorias essenciais</button><button class="btn sec pequeno" onclick="juntarCategorias()">Juntar duas categorias</button><input type="text" id="novaCat" placeholder="Nova categoria" style="max-width:220px"><button class="btn sec pequeno" onclick="novaCategoria()">Adicionar categoria</button></div></section>
  <section class="painel"><h2>Backup e exportação</h2><div class="sub">Baixe uma cópia completa dos dados a qualquer momento.</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sec" onclick="exportarCSV()">Exportar para Excel (CSV)</button><button class="btn sec" onclick="backupJSON()">Backup completo (JSON)</button></div></section>`;
}
function alterarCorte(){
  abrirModal(`<h2>Alterar a data do Marco Zero</h2><p>Os indicadores passam a considerar só registros a partir da nova data. Nenhum dado é apagado. Para confirmar, digite <b>ALTERAR</b>.</p>
  <div class="linha-campos" style="margin-top:14px"><div class="campo"><label for="nCorte">Nova data</label><input type="date" id="nCorte" value="${corte()}"></div><div class="campo"><label for="nConf">Confirmação</label><input type="text" id="nConf" autocomplete="off"></div></div>
  <div class="botoes"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn perigo" id="nOk">Alterar data de corte</button></div>`);
  document.getElementById('nOk').onclick=async()=>{ if(document.getElementById('nConf').value.trim().toUpperCase()!=='ALTERAR') return avisar('Digite ALTERAR para confirmar.'); const d=document.getElementById('nCorte').value; if(!d) return;
    await salvarConfig('marco_zero',{data:d,definido_em:new Date().toISOString(),anterior:corte()},'Data de corte alterada'); fecharModal(); document.getElementById('marcoMenu').textContent='Marco Zero em '+dataBR(d); ir('conf'); };
}
async function salvarEssenciais(){ const m={}; document.querySelectorAll('[data-ess]').forEach(i=>m[i.dataset.ess]=i.checked); await salvarConfig('cat_essencial',m,'Categorias salvas'); }
async function novaCategoria(){ const n=document.getElementById('novaCat').value.trim(); if(!n) return; const ja=S.cats.find(c=>chaveCat(c)===chaveCat(n)); if(ja) return avisar(`Essa categoria já existe como "${ja}".`);
  const {error}=await sb.from('categorias').insert({nome:n}); if(error) return erroBanco(error); S.cats.push(n); S.cats.sort((a,b)=>a.localeCompare(b,'pt-BR')); avisar('Categoria adicionada'); ir('conf'); }
function backupJSON(){ baixar(JSON.stringify({gerado_em:new Date().toISOString(),lancamentos:S.lanc,entradas:S.ent,patrimonio:S.pat,historico:S.hist,orcamentos:S.bud,cartoes:S.cartoes,metas:S.metas,config:S.cfg},null,1),'financas-familia-backup-'+HOJE+'.json','application/json'); avisar('Backup baixado'); }

initAuth();
</script>
</body>
